[project]
name = "mcp-audit"
version = "0.1.0"
description = "Conformance test kit for MCP servers — schema, encoding, and path-safety checks seeded by real upstream bugs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_audit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
