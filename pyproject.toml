[project]
name = "mcp-audit"
version = "0.2.0"
description = "Conformance test kit for MCP servers — schema, encoding, and path-safety checks seeded by real upstream bugs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.0.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
mcp-audit = "mcp_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_audit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a runnable fixture server via MCP_FIXTURE_SERVER env var",
]
asyncio_mode = "auto"

[tool.pytest_asyncio]
default_fixture_loop_scope = "function"
